name: Publish Docker Hub image
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sync
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sync -d sync_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://sync:test-only@localhost:5432/sync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/discord-jira-sync:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/discord-jira-sync:${{ github.sha }}
